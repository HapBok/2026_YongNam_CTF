[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yeongnam-ctf-engine"
version = "0.1.0"
description = "Eight-worker Codex stage pipeline"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ctfctl = "ctf_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
